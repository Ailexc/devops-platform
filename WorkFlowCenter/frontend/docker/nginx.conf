server {
    listen 80;
    server_name frontend.workflow.orb.local;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：唯一容器名 + 每次请求实时解析，
    # 避免 devops-net 上跨项目服务名冲突（api）及容器换 IP 后缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # API 反向代理
    location /api/ {
        set $api_upstream http://workflow-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 生成接口推理较慢，放宽代理超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SSE 流式接口特殊配置
    location ~ ^/api/v1/ai/config/generate-(form|flow)-stream/$ {
        set $api_upstream http://workflow-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 必须配置
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        
        # 禁用压缩，确保流式传输
        proxy_set_header Accept-Encoding '';
    }

    # Django Admin（迁移到 /django-admin/，/admin/* 留给前端管理页面）
    location /django-admin/ {
        set $api_upstream http://workflow-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback（禁止缓存 index.html，确保每次获取最新引用）
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 静态资源：Vite 已做 content hash，可安全长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

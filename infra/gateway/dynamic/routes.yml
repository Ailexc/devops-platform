# ============================================================
# 统一网关动态路由：Host 规则 → 各系统 frontend（devops-net 服务名）
# 各目标容器必须已加入 devops-net 网络
# 方案 B：另加多端口纯 IP 路由，每个 entryPoint 对应一个系统，
#         面试官无需 hosts 映射，http://112.124.69.224:<port> 直达
# ============================================================
http:
  middlewares:
    # 认证中心 forwardAuth：校验 Authorization: Bearer <统一JWT>，通过则注入 X-Auth-* 头
    # 用于受网关保护的演示应用（mock-app / pilot-app 的 /api/*）
    auth-forward:
      forwardAuth:
        address: "http://authentication-auth-backend:8000/api/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-User"
          - "X-Auth-Username"
          - "X-Auth-Name"
          - "X-Auth-Source"

  routers:
    portal:
      rule: "Host(`devops.orb.local`) || Host(`portal.devops.orb.local`) || Host(`112.124.69.224`)"
      entryPoints: ["web"]
      service: portal

    cloud:
      rule: "Host(`cloud.devops.orb.local`)"
      entryPoints: ["web"]
      service: cloud

    event:
      rule: "Host(`event.devops.orb.local`)"
      entryPoints: ["web"]
      service: event

    iam:
      rule: "Host(`iam.devops.orb.local`)"
      entryPoints: ["web"]
      service: iam

    release:
      rule: "Host(`release.devops.orb.local`)"
      entryPoints: ["web"]
      service: release

    cmdb:
      rule: "Host(`cmdb.devops.orb.local`)"
      entryPoints: ["web"]
      service: cmdb

    workflow:
      rule: "Host(`workflow.devops.orb.local`)"
      entryPoints: ["web"]
      service: workflow

    # ===== 方案 B：多端口纯 IP 路由（对外预览，免 hosts 映射）=====
    cmdb-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-cmdb"]
      service: cmdb

    cloud-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-cloud"]
      service: cloud

    workflow-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-workflow"]
      service: workflow

    event-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-event"]
      service: event

    release-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-release"]
      service: release

    iam-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-iam"]
      service: iam

    # 认证 API 直连（调试/演示用）
    api-auth:
      rule: "Host(`api.auth.devops.orb.local`)"
      entryPoints: ["web"]
      service: auth-api

    # ===== Demo 应用 + 认证 API：多端口纯 IP 路由 =====
    # mock-app / pilot-app 的 /api/* 经 forwardAuth 鉴权，首页免鉴权（SPA 读 token）
    mock-ip-api:
      rule: "Host(`112.124.69.224`) && PathPrefix(`/api/`)"
      entryPoints: ["web-mock"]
      service: mock-app
      middlewares:
        - auth-forward
      priority: 10

    mock-ip-home:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-mock"]
      service: mock-app
      priority: 1

    pilot-ip-api:
      rule: "Host(`112.124.69.224`) && PathPrefix(`/api/`)"
      entryPoints: ["web-pilot"]
      service: pilot-app
      middlewares:
        - auth-forward
      priority: 10

    pilot-ip-home:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-pilot"]
      service: pilot-app
      priority: 1

    direct-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-direct"]
      service: direct-app

    oidc-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-oidc"]
      service: oidc-demo

    auth-api-ip:
      rule: "Host(`112.124.69.224`)"
      entryPoints: ["web-auth-api"]
      service: auth-api

    # Traefik Dashboard
    traefik:
      rule: "Host(`traefik.devops.orb.local`)"
      entryPoints: ["web"]
      service: api@internal

  services:
    portal:
      loadBalancer:
        servers:
          - url: "http://authentication-portal:80"

    cloud:
      loadBalancer:
        servers:
          - url: "http://cloud_manager_nginx:80"

    event:
      loadBalancer:
        servers:
          - url: "http://cmdb-event-frontend:80"

    iam:
      loadBalancer:
        servers:
          - url: "http://permission-center-frontend:80"

    release:
      loadBalancer:
        servers:
          - url: "http://release-frontend:80"

    cmdb:
      loadBalancer:
        servers:
          - url: "http://cmdb-task-frontend:80"

    workflow:
      loadBalancer:
        servers:
          - url: "http://workflow-frontend:80"

    auth-api:
      loadBalancer:
        servers:
          - url: "http://authentication-auth-backend:8000"

    # ---- Demo 应用（容器名已加入 devops-net）----
    mock-app:
      loadBalancer:
        servers:
          - url: "http://authentication-mock-app:8081"

    direct-app:
      loadBalancer:
        servers:
          - url: "http://authentication-direct-app:8003"

    pilot-app:
      loadBalancer:
        servers:
          - url: "http://authentication-pilot-app:8004"

    oidc-demo:
      loadBalancer:
        servers:
          - url: "http://authentication-oidc-demo:8005"

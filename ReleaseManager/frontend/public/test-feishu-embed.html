<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞书文档嵌入测试</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; color: #333; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .desc { color: #666; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .url { font-size: 12px; color: #999; word-break: break-all; margin-bottom: 12px; }
  iframe { width: 100%; border: 1px solid #e2e5f0; border-radius: 8px; }
  .status { margin-top: 12px; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  .success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
  .error { background: #fff2f0; color: #cf1322; border: 1px solid #ffa39e; }
  .info { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
  .btn { display: inline-block; padding: 8px 20px; background: #1677ff; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; margin-top: 8px; }
  .btn:hover { background: #4096ff; }
  label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; box-sizing: border-box; margin-bottom: 12px; }
  input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
  button { padding: 8px 20px; background: #1677ff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #4096ff; }
  .fallback { display: none; }
</style>
</head>
<body>

  <h1>🔍 飞书文档嵌入测试</h1>
  <p class="desc">测试飞书分享链接是否可以通过 iframe 嵌入到页面中</p>

  <div class="card">
    <label>飞书文档链接</label>
    <div style="display:flex;gap:8px">
      <input id="urlInput" value="https://bcna3u8mz4uk.feishu.cn/docx/TThndWKuIoDDyCxGFWwcEev1nmf?from=from_copylink" />
      <button onclick="load()">加载</button>
    </div>
  </div>

  <div class="card">
    <div class="url" id="urlDisplay">当前测试: -</div>
    <iframe id="embedFrame" height="600" sandbox="allow-scripts allow-forms allow-same-origin allow-popups" style="display:none"></iframe>
    <div id="fallback" class="fallback" style="text-align:center;padding:60px 20px;border:1px solid #ffe58f;border-radius:8px;background:#fffbe6">
      <div style="font-size:40px;margin-bottom:12px">⚠️</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:8px">无法直接嵌入</div>
      <div style="font-size:13px;color:#666;margin-bottom:16px">
        飞书文档可能限制了跨域嵌入，请点击下方按钮在新窗口打开
      </div>
      <a id="openBtn" href="#" target="_blank" class="btn">🔗 在新窗口打开</a>
    </div>
    <div id="status" class="status info">等待加载...</div>
  </div>

  <div class="card">
    <p style="font-size:13px;color:#666;margin:0;line-height:1.6">
      <strong>测试结论记录：</strong><br>
      - 如果 iframe 显示内容 → ✅ 飞书支持嵌入<br>
      - 如果 iframe 空白 + 显示错误 → ❌ 飞书阻止了嵌入<br>
      - 如果显示"无法直接嵌入" → ⚠️ 被 CSP/X-Frame-Options 拦截<br>
      - 无论哪种情况，都提供"新窗口打开"按钮作为回退
    </p>
  </div>

<script>
  function load() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;
    document.getElementById('urlDisplay').textContent = '当前测试: ' + url;
    document.getElementById('openBtn').href = url;

    const frame = document.getElementById('embedFrame');
    const fallback = document.getElementById('fallback');
    const status = document.getElementById('status');

    // 重置状态
    frame.style.display = 'none';
    fallback.style.display = 'none';
    status.className = 'status info';
    status.textContent = '正在加载 iframe...';

    // 尝试嵌入
    frame.src = url;
    frame.style.display = 'block';

    // 设置超时检测
    let loaded = false;
    let timeout = setTimeout(() => {
      if (!loaded) {
        status.className = 'status error';
        status.textContent = '❌ 加载超时（10秒）— 飞书文档可能阻止了 iframe 嵌入';
        frame.style.display = 'none';
        fallback.style.display = 'block';
      }
    }, 10000);

    frame.onload = () => {
      loaded = true;
      clearTimeout(timeout);
      try {
        // 尝试访问 iframe 内容（跨域限制时会抛异常）
        const doc = frame.contentDocument || frame.contentWindow.document;
        status.className = 'status success';
        status.textContent = '✅ 嵌入成功！飞书文档内容已加载';
        fallback.style.display = 'none';
      } catch (e) {
        // 跨域了但 iframe 加载了
        status.className = 'status success';
        status.textContent = '✅ iframe 已加载（跨域无法读取内容，但页面显示正常）';
        fallback.style.display = 'none';
      }
    };

    frame.onerror = () => {
      loaded = true;
      clearTimeout(timeout);
      status.className = 'status error';
      status.textContent = '❌ 加载失败 — 飞书文档阻止了 iframe 嵌入';
      frame.style.display = 'none';
      fallback.style.display = 'block';
    };
  }

  // 页面加载后自动测试
  window.onload = () => setTimeout(load, 500);
</script>

</body>
</html>

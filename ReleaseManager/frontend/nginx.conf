server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback - 所有未匹配的路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 release-backend
    location /api/ {
        proxy_pass http://release-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Django Admin 面板
    location /admin/ {
        proxy_pass http://release-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC 统一认证（/oauth/login 302 → 认证中心；/oauth/callback 收 code 换 token）
    # redirect_uri 以 <frontend>/oauth/callback 注册 → rewrite 到后端真实路径 /api/v1/oauth/
    location /oauth/ {
        rewrite ^/oauth/(.*)$ /api/v1/oauth/$1 break;
        proxy_pass http://release-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
  namespace: release-demo
  labels:
    app: go-app
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
        track: stable
    spec:
      containers:
      - name: go-app
        image: go-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "1.0.0"
        - name: ENV
          value: "dev"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-app
  namespace: release-demo
spec:
  selector:
    app: go-app
    track: stable
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP

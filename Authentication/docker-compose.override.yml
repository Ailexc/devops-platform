# Authentication OrbStack 专属配置（仅 Mac + OrbStack 生效；Linux 上标签被忽略，无害）
# 规范 R3：平台特有能力不放 base compose 文件
# 用法：与 docker-compose.yml 同目录时，`docker compose up` 自动叠加本文件
services:
  openldap:
    labels:
      - "dev.orbstack.domains=ldap.${COMPOSE_PROJECT_NAME:-authentication}.orb.local"

  lam:
    labels:
      - "dev.orbstack.domains=ldapadmin.${COMPOSE_PROJECT_NAME:-authentication}.orb.local"

  auth-backend:
    labels:
      - "dev.orbstack.domains=api.${COMPOSE_PROJECT_NAME:-authentication}.orb.local"

  portal:
    labels:
      - "dev.orbstack.domains=portal.${COMPOSE_PROJECT_NAME:-authentication}.orb.local"

  mock-app:
    labels:
      - "dev.orbstack.domains=mock.${COMPOSE_PROJECT_NAME:-authentication}.orb.local"

  direct-app:
    labels:
      - "dev.orbstack.domains=direct.${COMPOSE_PROJECT_NAME:-authentication}.orb.local"

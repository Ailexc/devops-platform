# Go stack Docker Compose
services:
  go-postgres:
    image: postgres:16-alpine
    container_name: cmdb-event-go-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${GO_POSTGRES_DB:-eventdb_go}
      POSTGRES_USER: ${GO_POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${GO_POSTGRES_PASSWORD:-eventpass}
    ports:
      - "5433:5432"
    expose:
      - "5432"
    volumes:
      - go-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GO_POSTGRES_USER:-eventuser} -d ${GO_POSTGRES_DB:-eventdb_go}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  go-redis:
    image: redis:7-alpine
    container_name: cmdb-event-go-redis
    ports:
      - "6380:6379"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  go-api:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cmdb-event-go-api
    command: api
    env_file: .env
    environment:
      DATABASE_URL: postgres://${GO_POSTGRES_USER:-eventuser}:${GO_POSTGRES_PASSWORD:-eventpass}@cmdb-event-go-postgres:5432/${GO_POSTGRES_DB:-eventdb_go}
      REDIS_URL: redis://cmdb-event-go-redis:6379/0
      API_PORT: "8000"
      OUTPUT_DIR: /output
      DOCS_DIR: /app/docs
      DEBUG: "false"
    expose:
      - "8000"
    depends_on:
      go-postgres:
        condition: service_healthy
      go-redis:
        condition: service_healthy
    volumes:
      - go-output:/output
    restart: unless-stopped

  go-worker:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cmdb-event-go-worker
    command: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://${GO_POSTGRES_USER:-eventuser}:${GO_POSTGRES_PASSWORD:-eventpass}@cmdb-event-go-postgres:5432/${GO_POSTGRES_DB:-eventdb_go}
      REDIS_URL: redis://cmdb-event-go-redis:6379/0
      WORKER_CONCURRENCY: "10"
      OUTPUT_DIR: /output
    depends_on:
      go-postgres:
        condition: service_healthy
      go-redis:
        condition: service_healthy
    volumes:
      - go-output:/output
    restart: unless-stopped

  # 前端 nginx 同源反代：/ → SPA，/go-api/ → go-api:8000（容器内相对路径，跨平台）
  # （原自带 traefik 已退役，规范 R4：路由统一收敛到 infra/gateway）
  go-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cmdb-event-go-frontend
    environment:
      VITE_API_BASE_URL: /go-api/v1
    ports:
      - "8081:80"

volumes:
  go-pgdata:
  go-output:

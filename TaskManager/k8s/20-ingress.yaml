# ──────────────────────────────────────────────────────────────────
# Ingress — 外部访问入口
# 作用: 将域名 cmdb.example.com 的流量路由到前端服务
# 需要集群中有 Ingress Controller（如 nginx-ingress 或 traefik）
# ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cmdb-ingress
  namespace: cmdb
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"    # 是否强制 HTTPS
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: cmdb.example.com        # ← 替换为你的实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

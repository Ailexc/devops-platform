# ──────────────────────────────────────────────────────────────────
# PersistentVolumeClaim: 持久化存储声明
# Redis 和 PostgreSQL 需要持久化数据，避免 Pod 重启后数据丢失
# ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: cmdb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: cmdb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

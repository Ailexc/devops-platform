server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：让 backend 域名每次请求实时解析，
    # 避免后端容器重启换 IP 后 Nginx 仍缓存旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        set $backend_upstream http://cmdb-task-backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Go 后端反代（前端切换到 Go 时走这里）
    # /go-api/api/v1/... → http://cmdb-task-go-backend:8080/api/v1/...
    location /go-api/ {
        set $go_backend_upstream http://cmdb-task-go-backend:8080;
        rewrite ^/go-api/(.*) /$1 break;
        proxy_pass $go_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

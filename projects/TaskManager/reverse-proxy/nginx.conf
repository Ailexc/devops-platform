# ── CMDB 本地多服务反向代理配置 ──
# 所有 cmdb.*.local 域名指向同一台 Nginx，
# 根据 Host 头部自动路由到对应的容器服务。
#
# 域名规划:
#   cmdb.task.local   → 任务管理系统 (Vue.js 前端)
#   cmdb.api.local     → 后端 REST API (Django)
#   cmdb.event.local   → 事件管理系统 (预留)
#   cmdb.asset.local   → 资产管理 (预留)
#   cmdb.${name}.local → 扩展其他微前端系统

upstream task_frontend {
    server frontend:80;
}

upstream backend_api {
    server backend:8000;
}

# 待接入系统示例（只需取消注释并启动对应容器）
# upstream event_frontend {
#     server event-frontend:80;
# }
# upstream asset_frontend {
#     server asset-frontend:80;
# }


# ═══════════════════════════════════════
# 任务管理系统 - cmdb.task.local
# ═══════════════════════════════════════
server {
    listen 80;
    server_name cmdb.task.local;

    # 前端静态页面 + SPA 路由
    location / {
        proxy_pass http://task_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 请求转发到后端（兼容直接通过域名访问）
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ═══════════════════════════════════════
# 后端 API - cmdb.api.local
# (直接暴露 Django REST API，供调试或客户端调用)
# ═══════════════════════════════════════
server {
    listen 80;
    server_name cmdb.api.local;

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 管理后台
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ═══════════════════════════════════════
# 预留：事件管理系统 - cmdb.event.local

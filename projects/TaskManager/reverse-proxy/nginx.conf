# ═══════════════════════════════════════
# 默认：未知域名重定向到任务管理系统
# ═══════════════════════════════════════
server {
    listen 80 default_server;
    server_name _;

    # 返回一个简单的服务列表页面
    root /usr/share/nginx/html;
    index index.html;

    location / {
        return 200 '
<!DOCTYPE html>
<html>
<head><title>CMDB 本地服务</title>
<meta charset="utf-8">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
       background: #f5f7fa; display: flex; justify-content: center;
       align-items: center; min-height: 100vh; margin: 0; }
.container { text-align: center; max-width: 600px; padding: 40px; }
h1 { color: #4f6ef7; font-size: 1.5rem; }
ul { list-style: none; padding: 0; }
li { margin: 12px 0; }
a { color: #4f6ef7; text-decoration: none; font-size: 1.1rem; }
a:hover { text-decoration: underline; }
.help { color: #8b92a5; font-size: 0.85rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="container">
  <h1>🏗️ CMDB 本地开发服务</h1>
  <p style="color:#666;">请通过以下域名访问对应系统：</p>
  <ul>
    <li><a href="http://cmdb.task.local">📋 cmdb.task.local</a> — 任务管理系统</li>
    <li><a href="http://cmdb.api.local">🔌 cmdb.api.local</a> — 后端 API</li>
    <li style="color:#bbb;">⏳ cmdb.event.local — 事件管理 (预留)</li>
    <li style="color:#bbb;">⏳ cmdb.asset.local — 资产管理 (预留)</li>
  </ul>
  <div class="help">💡 确保已配置本地 DNS（见 README）</div>
</div>
</body>
</html>';
        add_header Content-Type text/html;
    }
}

# 统一认证中心 - 全栈编排
# 服务：认证中心(api) / 统一门户(portal) / OpenLDAP / LAM / 演示应用(mock-app)
# 路由：浏览器流量统一走 infra/gateway（devops-gateway :8088-8099），本项目不再自带 Traefik（规范 R4）
# OrbStack 专属域名标签在 docker-compose.override.yml（规范 R3）

services:
  openldap:
    image: osixia/openldap:1.5.0
    # 可选服务：演示 LDAP 身份源时启用（docker compose --profile ldap up -d）
    # 默认全栈不依赖它；bitnami 镜像在本镜像源 403，故用 osixia
    profiles: ["ldap"]
    container_name: authentication-openldap
    environment:
      - LDAP_ORGANISATION=DevOps
      - LDAP_DOMAIN=devops.com
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD:-adminpass}
      - LDAP_BASE_DN=dc=devops,dc=com
    ports:
      - "389:389"
    volumes:
      # 将 seed.ldif 通过 entrypoint 复制进容器层 custom 目录（osixia 初始化后会删除
      # custom 目录，故不能用 bind mount 直接挂载 custom）
      - ./ldap:/seed:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /container/service/slapd/assets/config/bootstrap/ldif/custom
        cp /seed/seed.ldif /container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif
        exec /container/tool/run --copy-service
    # OrbStack 专属域名标签已移至 docker-compose.override.yml（规范 R3）
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=devops,dc=com -D cn=admin,dc=devops,dc=com -w $$LDAP_ADMIN_PASSWORD '(&)' | grep -q 'dc=devops,dc=com'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # OpenLDAP 可视化管理界面（与 openldap 同 profile，随 --profile ldap 一起启动）
  # LDAP Account Manager (LAM) - 现代化 Web 界面，替代已停更的 phpLDAPadmin
  # 登录：用户 lam / 密码 ${LDAP_ADMIN_PASSWORD}（LAM 预配置将 LAM 密码与 LDAP admin 密码保持一致）
  lam:
    image: ldapaccountmanager/lam:stable
    profiles: ["ldap"]
    container_name: authentication-lam
    restart: unless-stopped
    environment:
      - LAM_SKIP_PRECONFIGURE=false
      - LAM_PASSWORD=${LDAP_ADMIN_PASSWORD:-adminpass}
      - LAM_LANG=zh_CN
      - LDAP_SERVER=ldap://openldap:389
      - LDAP_DOMAIN=devops.com
      - LDAP_BASE_DN=dc=devops,dc=com
      - LDAP_USERS_DN=ou=people,dc=devops,dc=com
      - LDAP_GROUPS_DN=ou=groups,dc=devops,dc=com
      - LDAP_USER=cn=admin,dc=devops,dc=com
    ports:
      - "8083:80"
    depends_on:
      openldap:
        condition: service_healthy
    # OrbStack 专属域名标签已移至 docker-compose.override.yml（规范 R3）
    networks:
      - default

  auth-backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_FLAGS: ${PIP_FLAGS:-}
    container_name: authentication-auth-backend
    restart: unless-stopped
    command: >
      sh -c "python /srv/auth/app/wait_for_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # 统一 PostgreSQL（devops-net 网络，一实例多库 devops_auth）
      - DATABASE_URL=postgresql://devops:devops@devops-postgres:5432/devops_auth
      - AUTH_PROVIDER_ORDER=${AUTH_PROVIDER_ORDER:-ldap,local}
      - AUTH_PROVIDER_LOCAL_ENABLED=${AUTH_PROVIDER_LOCAL_ENABLED:-true}
      - AUTH_PROVIDER_LDAP_ENABLED=${AUTH_PROVIDER_LDAP_ENABLED:-true}
      - LDAP_SERVER_URI=ldap://openldap:389
      - LDAP_BIND_DN=cn=admin,dc=devops,dc=com
      - LDAP_BIND_PASSWORD=${LDAP_ADMIN_PASSWORD:-adminpass}
      - LDAP_USER_SEARCH_BASE=ou=people,dc=devops,dc=com
      - LDAP_USER_SEARCH_FILTER=(uid={username})
      # 门户地址（浏览器可达，各环境由 .env.<env> 覆盖；默认 localhost 兑底，规范 R1）
      - PORTAL_URL=${PORTAL_URL:-http://localhost:8088}
      # 应用跳转地址（浏览器可达，统一网关端口兑底；各环境由 .env.<env> 覆盖，规范 R1）
      - APP_URL_TASK_MANAGER=${APP_URL_TASK_MANAGER:-http://localhost:8089}
      - APP_URL_CLOUD_MANAGER=${APP_URL_CLOUD_MANAGER:-http://localhost:8090}
      - APP_URL_WORKFLOW_CENTER=${APP_URL_WORKFLOW_CENTER:-http://localhost:8091}
      - APP_URL_EVENT_MANAGER=${APP_URL_EVENT_MANAGER:-http://localhost:8092}
      - APP_URL_RELEASE_MANAGER=${APP_URL_RELEASE_MANAGER:-http://localhost:8093}
      - APP_URL_PERMISSION_CENTER=${APP_URL_PERMISSION_CENTER:-http://localhost:8094}
      - APP_URL_LAM=${APP_URL_LAM:-http://localhost:8083}
      # Demo 应用跳转地址
      - APP_URL_MOCK_APP=${APP_URL_MOCK_APP:-http://localhost:8095}
      - APP_URL_DIRECT_APP=${APP_URL_DIRECT_APP:-http://localhost:8096}
      - APP_URL_PILOT_APP=${APP_URL_PILOT_APP:-http://localhost:8097}
      - APP_URL_OIDC_DEMO=${APP_URL_OIDC_DEMO:-http://localhost:8098}
    ports:
      - "8002:8000"
    volumes:
      - auth-keys:/srv/auth/.jwt_keys
    networks:
      - default
      - devops-net
    # OrbStack 专属域名标签已移至 docker-compose.override.yml（规范 R3）

  portal:
    build: ./frontend
    container_name: authentication-portal
    # 不对外暴露端口，通过统一网关（:8088）访问
    depends_on:
      - auth-backend
    # OrbStack 专属域名标签已移至 docker-compose.override.yml（规范 R3）
    networks:
      - default
      - devops-net

  mock-app:
    build: ./mock-app
    container_name: authentication-mock-app
    # 不对外暴露端口，只能经 Traefik 网关访问（体现「受保护业务系统」）
    depends_on:
      - auth-backend
    networks:
      - default
      - devops-net

  direct-app:
    build:
      context: ./direct-app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_FLAGS: ${PIP_FLAGS:-}
    container_name: authentication-direct-app
    # 直连模式示例：不经统一网关，业务自身用 JWKS 公钥本地验签统一 JWT
    environment:
      - AUTH_JWKS_URL=http://auth-backend:8000/.well-known/jwks.json
      - PORT=8003
    ports:
      - "8003:8003"
    depends_on:
      - auth-backend
    # OrbStack 专属域名标签已移至 docker-compose.override.yml（规范 R3）
    networks:
      - default
      - devops-net

  pilot-app:
    build: ./pilot-app
    container_name: authentication-pilot-app
    # 试点接入示例：Mac 本地经宿主端口 8004 直达；服务器由 .env.server 覆盖为统一网关 8097
    ports:
      - "8004:8000"
    depends_on:
      - auth-backend
    networks:
      - default
      - devops-net

  oidc-demo:
    build: ./oidc-demo
    container_name: authentication-oidc-demo
    # OIDC 授权码模式演示应用：client_secret 只在应用后端用于换 token
    environment:
      - CLIENT_ID=oidc-demo-app
      - CLIENT_SECRET=oidc-demo-secret-123456
      # redirect_uri / authorize_url 云端用 .env.cloud 覆盖为公网地址（OIDC_REDIRECT_URI / OIDC_AUTHORIZE_URL）
      - REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:8005/callback}
      - AUTH_AUTHORIZE_URL=${OIDC_AUTHORIZE_URL:-http://localhost:8002/oauth/authorize}
      # token / userinfo 由本应用后端调用，走 devops-net 内部服务名，无需公网
      - AUTH_TOKEN_URL=http://auth-backend:8000/oauth/token
      - AUTH_USERINFO_URL=http://auth-backend:8000/oauth/userinfo
    ports:
      - "8005:8005"
    depends_on:
      - auth-backend
    networks:
      - default
      - devops-net

  # 自带 Traefik（authentication-gateway）已退役：路由统一收敛到 infra/gateway（规范 R4），
  # 其 dynamic.yml 曾引用本项目不存在的服务（cloud-manager-service 等），属 Mac 单机 Demo 遗留。

volumes:
  ldap-data:
  ldap-config:
  auth-keys:

networks:
  default:
  # 统一基础设施网络（由根目录 infra/docker-compose.yml 创建）
  devops-net:
    external: true

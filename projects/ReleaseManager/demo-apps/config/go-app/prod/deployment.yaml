apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
  namespace: release-demo-prod
  labels:
    app: go-app
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
        track: stable
    spec:
      containers:
      - name: go-app
        image: go-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "1.0.0"
        - name: ENV
          value: "prod"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

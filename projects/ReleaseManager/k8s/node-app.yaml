apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  namespace: release-demo
  labels:
    app: node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: release-demo/node-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: "node-demo"
        - name: APP_VERSION
          value: "1.0.0"
        - name: ENV
          value: "dev"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: node-app
  namespace: release-demo
spec:
  selector:
    app: node-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082
  type: NodePort